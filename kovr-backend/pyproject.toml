[project]
name = "kovr-backend"
version = "0.1.0"
description = "KOVR — AI security scanner: scans repos, generates verified fixes, opens PRs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cerebras-cloud-sdk>=1.91.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "gitpython>=3.1.58",
    "groq>=1.6.0",
    "langsmith>=0.12.6",
    "openai>=3.8.0",
    "passlib[argon2]>=1.7.4",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "semgrep>=1.172.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# CPU-only torch: the default PyPI wheel drags ~2.5GB of NVIDIA CUDA
# libraries into the image that a CPU deployment never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

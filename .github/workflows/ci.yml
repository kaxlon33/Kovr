name: CI

# Every push and pull request runs the full quality gate: backend tests
# + app import smoke check, frontend typecheck + lint + build. A red ❌
# here means broken code never reaches deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # enables the "Run workflow" button in the Actions tab

jobs:
  backend:
    name: 🐍 Backend — tests + import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kovr-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Import smoke check (catches undefined names at startup)
        run: uv run python -c "import app.main; print('app imports OK')"

      - name: Run tests
        run: uv run pytest tests -q

  frontend:
    name: ⚛️ Frontend — typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kovr-frontend_new
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kovr-frontend_new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kovr_user
      POSTGRES_PASSWORD: kovr_pass
      POSTGRES_DB: kovr
    ports:
      - "5432:5432"
    volumes:
      - kovr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovr_user -d kovr"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: . # compose paths are relative to this file's directory
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kovr_user:kovr_pass@db:5432/kovr
      # Auth — generate once: python -c "import secrets; print(secrets.token_hex(32))"
      JWT_SECRET: ${JWT_SECRET:-change-me-64-char-random-hex}
      COOKIE_SECURE: "false" # local docker is plain HTTP
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180,http://localhost:3000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5180}
      # AI provider chain: groq -> groq fallback -> openrouter -> gemini
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_FALLBACK_MODEL: openai/gpt-oss-20b
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: openrouter/free
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash
      # GitHub — per-user OAuth for PRs (register an OAuth App, callback
      # http://localhost:8000/api/github/callback locally)
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # Observability (optional)
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: kovr
    volumes:
      - ./cloned_repos:/app/cloned_repos

volumes:
  kovr_pgdata:
